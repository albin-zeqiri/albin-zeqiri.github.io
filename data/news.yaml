# ---- 2026 ----

- date: 2026-11-07
  text: "I was invited to lead a workshop at the [PRIO1 Klima-Event](https://prio1-klima.net/klima-event/) in Heidelberg based on our [PlantPal](/projects/plantpal/) paper: *Roboter im Stadtbeet? Zukunftsszenarien für nachhaltiges Urban Gardening* (robots in urban gardens)."

- date: 2026-09-18
  text: "Premiere of [*Spaceman*](https://www.theater-ulm.de/spielplan/stuecke/spaceman) at **Theater Ulm**. Together with [Annalisa Degenhard](https://www.linkedin.com/in/annalisa-degenhard-7950241b4/), I implemented the passthrough AR experience for the production: virtual scenery and characters that interact with the actors on stage for the entire multi-hour play."

