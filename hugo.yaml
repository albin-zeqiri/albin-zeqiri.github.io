baseURL: "https://albin-zeqiri.github.io/"
languageCode: "en-us"
title: "Albin Zeqiri"
theme: hugo-profile

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"

enableRobotsTXT: true

markup:
  goldmark:
    renderer:
      unsafe: true

# Extra menu entries (appear after the built-in section links)
menus:
  main:
    - identifier: outreach
      name: Outreach
      title: Outreach & Collaborations
      url: /#outreach
      weight: 1
    - identifier: news
      name: News
      title: News
      url: /#news
      weight: 2
    - identifier: contact
      name: Contact
      title: Contact
      url: /#contact
      weight: 3

params:
  title: "Albin Zeqiri"
  description: "Albin Zeqiri — HCI researcher and doctoral candidate at Ulm University."
  favicon: "/favicon.svg"
  useBootstrapCDN: false
  mathjax: false
  animate: true

  # No day/night switch: the hero and navbar are always dark (custom.css),
  # every section below is light.
  theme:
    disableThemeToggle: true
    defaultTheme: "light"

  color:
    textColor: "#1d1f23"
    secondaryTextColor: "#5f6670"
    textLinkColor: "#0b7a6b"   # dark shade of the mint accent, readable on white
    backgroundColor: "#ffffff"
    primaryColor: "#111418"
    secondaryColor: "#f4f5f7"

  font:
    fontSize: 1rem
    fontWeight: 400
    lineHeight: 1.5
    textAlign: left

  navbar:
    align: ms-auto
    brandName: "Albin Zeqiri"
    showBrandLogo: false
    disableSearch: true
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: true   # re-added via `menus` so it appears last

  # ---------------------------------------------------------------- Hero
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Albin Zeqiri."
    content: "I’m a final-year PhD candidate in HCI at Ulm University, investigating carbon-aware design for everyday interactive systems and its implications for user behavior and carbon emissions."
    image: "/images/profile.jpg"
    roundImage: true
    bottomImage:
      enable: true
    button:
      enable: true
      name: "CV"
      url: "/cv_zeqiri.pdf"
      download: false
      newPage: true
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/albinzeq/
        - icon: fas fa-graduation-cap
          url: https://scholar.google.com/citations?hl=en&user=UX-Ub5wAAAAJ
        - icon: fab fa-researchgate
          url: https://www.researchgate.net/profile/Albin-Zeqiri
        - icon: fab fa-orcid
          url: https://orcid.org/0000-0001-6516-3810
        - icon: fab fa-github
          url: https://github.com/az16
        - icon: fab fa-x-twitter
          url: https://x.com/azeqiri6
        - icon: fas fa-envelope
          url: mailto:zeqiri.albin@outlook.de

  # ---------------------------------------------------------------- About
  about:
    enable: true
    title: "About Me"
    content: |-
      During my master’s studies, I specialized in **deep learning**, with a focus on **visual computing** and **human behavior modeling**. In my PhD at Ulm University, I combine this expertise with **experimental research methods** and **user-centered design** to develop and evaluate **carbon-aware interactive systems** and assess whether they achieve their intended outcomes. Alongside my doctoral research, I collaborate with partners including **University College London (UCL)** and **Mercedes-Benz Tech Innovation**, providing methodological guidance and implementing **reproducible pipelines for evaluating machine learning models**.  Beyond my research, I enjoy working with creative practitioners such as the Theatre of Ulm to bring interactive technology to new audiences. Most recently, I co-developed the **augmented reality experience** for Theater Ulm’s production of [Spaceman](https://www.theater-ulm.de/spielplan/stuecke/spaceman)
    skills:
      enable: false

  # Experience and education live in the CV (hero button), not on the page.
  experience:
    enable: false
  education:
    enable: false

  # ---------------------------------------------------------------- Publications (theme "projects" section)
  # Papers are Markdown files in content/projects/. See README.md.
  projects:
    enable: true
    title: "Publications"

  # ---------------------------------------------------------------- Grants & awards (theme "achievements" section)
  achievements:
    enable: true
    title: "Fellowships & Grants"
    items:
      - title: "DFG Reinhart Koselleck Project VRooms"
        issuer: "German Research Foundation (DFG) · €1,250,000"
        url: "https://gepris.dfg.de/gepris/projekt/547748299"
        year: "2025"
        icon: "fas fa-file-signature"
        content: "Co-authored the successful proposal with Prof. Dr. Enrico Rukzio: fighting climate change by increasing the utilization of buildings through everyday extended reality."
      - title: "LGFG Doctoral Fellowship"
        issuer: "Landesgraduiertenförderung Baden-Württemberg"
        year: "2023"
        icon: "fas fa-award"
        content: "Competitive three-year scholarship funding my PhD research."
      - title: "AI Grid Member (Alumnus)"
        issuer: "AI Grid · funded by the German Federal Ministry of Education and Research"
        url: "https://ai-grid.org/en/"
        year: "2023"
        icon: "fas fa-network-wired"
        content: "Selected through a competitive review for Germany's network of early-career AI researchers, connecting them with expert mentors."
      - title: "DAAD Travel Grant"
        issuer: "German Academic Exchange Service (DAAD)"
        year: "2026"
        icon: "fas fa-plane-departure"
        content: "Congress travel grant to present my work at CHI 2026 in Barcelona."
      - title: "Graduate Travel Grant"
        issuer: "Graduate & Professional Training Center Ulm"
        year: "2024"
        icon: "fas fa-plane-departure"
        content: "€2,800 to present two papers at UbiComp 2024 in Melbourne."

  # ---------------------------------------------------------------- Outreach & collaborations
  outreach:
    enable: true
    title: "Outreach & Collaborations"
    items:
      - title: "Spaceman"
        kind: "Theater Collaboration"
        partner: "Theater Ulm"
        date: "Sep 2026"
        icon: "fas fa-masks-theater"
        content: "Together with [Annalisa Degenhard](https://www.linkedin.com/in/annalisa-degenhard-7950241b4/), I implemented the passthrough AR experience for the stage production: virtual scenery and characters that interact with the actors throughout the entire multi-hour play."
        url: "https://www.theater-ulm.de/spielplan/stuecke/spaceman"
      - title: "Roboter im Stadtbeet?"
        kind: "Invited Workshop"
        partner: "PRIO1 Klima-Event, Heidelberg"
        date: "Nov 2026"
        icon: "fas fa-chalkboard-user"
        content: "Invited to lead a workshop on future scenarios for robot-supported urban gardening, based on our PlantPal paper."
        url: "https://prio1-klima.net/klima-event/"

  # ---------------------------------------------------------------- Contact
  contact:
    enable: true
    content: "Interested in my research or a collaboration? I'm happy to hear from you."
    btnName: "Mail me"
    btnLink: "mailto:zeqiri.albin@outlook.de"

  footer:
    recentPosts:
      enable: false
    socialNetworks:
      github: https://github.com/az16
      linkedin: https://www.linkedin.com/in/albinzeq/
      twitter: https://x.com/azeqiri6

  singlePages:
    socialShare: false
    readTime:
      enable: false
    scrollprogress:
      enable: true

  terms:
    copyright: "All rights reserved"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"
