  # ---------------------------------------------------------------- About
  about:
    enable: true
    title: "About"
    content: |-
      I am a final-year PhD candidate in Human–Computer Interaction at Ulm University. Using my background in **machine learning** and **experimental research methods**, I investigate how interactive systems can help users reach their intended goals while meeting **ecological objectives set by companies and policymakers**. Leveraging a use-case-based research approach, I have studied this across contexts such as **mobility**, **appliances**, and **urban robotics**. My current work focuses on building design, where I use **XR and generative AI** to support the planning and use of spaces. In collaborations across industry and academia (**Mercedes-Benz Tech Innovation**, **UCL Interaction Centre**, **Karlsruhe Institute of Technology**), I was responsible for planning, implementing, and evaluating **customized machine learning pipelines**. My research and collaborative projects have been published at top-tier venues such as [**CHI**](https://dl.acm.org/conference/chi) and [**IMWUT**](https://dl.acm.org/journal/imwut).
    skills:
      enable: false

  # ---------------------------------------------------------------- Selected projects (cards after About)
  # `page` is the file name in content/projects/ (without .md).
  selected:
    enable: true
    title: "Selected Projects"
    items:
      - page: plantpal
        name: "PlantPal"
        video: "/images/papers/plantpal_story.mp4"
        poster: "/images/papers/plantpal_teaser.jpg"
        content: "Remote urban gardening through a shared precision agriculture robot. A 3-week field deployment (N=18) showed how people fit gardening into their daily routines from anywhere."
      - page: autotherm
        name: "AutoTherm"
        video: "/images/papers/autotherm.mp4"
        poster: "/images/papers/autotherm_teaser.jpg"
        content: "A dataset and deep learning benchmark for estimating thermal comfort indoors and in a BMW 3 Series, from 31 sensor signals and self-reported ratings."
      - page: bumpyride
        name: "Bumpy Ride?"
        poster: "/images/papers/bumpyride_teaser.jpg"
        content: "A field study (N=24) in moving vehicles on how G-forces, vibrations and maneuvers affect XR interaction techniques such as Gaze&Pinch and HeadGaze."

  # ---------------------------------------------------------------- Work experience (from the Oct 2026 CV)
  experience:
    enable: true
    title: "Research Experience"
    items:
      - role: "Research Associate"
        org: "Ulm University · Chair of Human–Computer Interaction"
        date: "Sep 2022 – present"
        icon: "fas fa-flask"
        points:
          - "Studied how interactive systems can meet ecological goals without hurting user experience through experiments, field deployments of artifacts, and interviews, resulting in **three first-author full papers at CHI and IMWUT**."
          - "Independently initiated and maintained a collaboration with the Botanical Garden Ulm, leading the development of a robot-based remote-gardening system and a mobile visitor app to evaluate design concepts with real users (**CHI ’25, CHI ’26**)."
          - "Built reproducible deep learning pipelines, ablation studies, and multi-API data mining workflows for **UCL Interaction Centre**, **KIT**, and **Mercedes-Benz Tech Innovation**, leading to three joint publications."
          - "Co-authored a successful **DFG Reinhart Koselleck proposal** on everyday XR for better building utilization, which frames my current building-design work."
          - "Supervised 40+ students from problem formulation to publication; **two student projects were published at CHI** and two students continued to a PhD."
      - role: "Research Assistant and Tutor"
        org: "Ulm University · Chairs of Human–Computer Interaction and Visual Computing"
        date: "Dec 2019 – Apr 2022"
        icon: "fas fa-vr-cardboard"
        points:
          - "Built VR prototypes in Unity and C# and supported the user studies run with them, giving the group working testbeds for new interaction techniques."
          - "Benchmarked monocular depth estimation models for accuracy and scalability to inform model selection."
          - "Taught C#, Unity, and UI/UX prototyping in tutorials."

