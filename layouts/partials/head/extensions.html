{{/* Site-specific styles (papers, grants, outreach, news timeline).
     Fingerprinted so browsers always load the latest version after a change. */}}
{{ with resources.Get "css/custom.css" }}
  {{ $css := . | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
{{ end }}
