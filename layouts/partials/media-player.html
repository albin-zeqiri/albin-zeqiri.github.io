{{/* Click-to-play video: shows the poster with a play button, nothing autoplays.
     Args (dict): src, poster, label. Playback is toggled by the script in head/extensions.html. */}}
<div class="media-player" data-player>
  <video src="{{ .src | relURL }}" {{ with .poster }}poster="{{ . | relURL }}"{{ end }} preload="none" muted loop playsinline{{ with .label }} aria-label="{{ . }}"{{ end }}></video>
  <span class="media-player__btn" role="button" tabindex="0" aria-label="Play video">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
  </span>
</div>
