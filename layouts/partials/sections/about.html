{{/* About (params.about): the CV profile text, across the content column in two columns on desktop. */}}
{{ with .Site.Params.about }}{{ if .enable }}
<section id="about" class="py-5">
  <div class="container">
    <h3 class="text-center section-title">{{ .title }}</h3>
    <div class="profile-text">
      {{ .content | markdownify }}
    </div>
  </div>
</section>
{{ end }}{{ end }}
