<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Coming soon">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#cfd4dc"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f9"/>
      <stop offset="1" stop-color="#e9ecf1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.6"/>

  <!-- paper / manuscript -->
  <g transform="translate(600 250)">
    <path d="M-70 -110 H35 L80 -65 V110 H-70 Z" fill="#ffffff" stroke="#343a40" stroke-width="9" stroke-linejoin="round"/>
    <path d="M35 -110 V-65 H80" fill="none" stroke="#343a40" stroke-width="9" stroke-linejoin="round"/>
    <g stroke="#adb5bd" stroke-width="9" stroke-linecap="round">
      <line x1="-42" y1="-60" x2="10" y2="-60"/>
      <line x1="-42" y1="-25" x2="52" y2="-25"/>
      <line x1="-42" y1="10" x2="52" y2="10"/>
      <line x1="-42" y1="45" x2="52" y2="45"/>
      <line x1="-42" y1="80" x2="20" y2="80"/>
    </g>
  </g>

  <text x="600" y="455" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#212529" letter-spacing="2">Coming soon</text>
  <text x="600" y="510" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#6c757d">Details will follow once the work is published</text>
</svg>
